<!DOCTYPE html>
<html>
<head>
    <title>Car Dodge Game</title>
    <style>
        body { text-align:center; font-family:sans-serif; background:#f0f0f0; }
        canvas { background:#87CEEB; display:block; margin:auto; border:2px solid #333; }
        h2 { color:#333; }
    </style>
</head>
<body>
    <h2>Car Dodge Game</h2>
    <canvas id="carCanvas" width="400" height="500"></canvas>
    <p>Score: <span id="score">0</span></p>
    <p>High Score: <span id="highScore">0</span></p>
    <button onclick="location.reload()">Restart Game</button>
    <script>
    const canvas = document.getElementById("carCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");
    const highScoreDisplay = document.getElementById("highScore");
    const car = { x: 170, y: 450, width: 60, height: 100, dx: 15 };
    const obstacles = [];
    let score = 0;
    let highScore = parseInt(localStorage.getItem('carDodgeHighScore')) || 0;
    highScoreDisplay.textContent = highScore;
    let speed = 3;
    let gameOver = false;
    let keys = {};

    // ✅ Save score to Railway MySQL
    function saveScore(finalScore) {
        fetch('save_score.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `game=flash&score=${finalScore}`
        })
        .then(r => r.json())
        .then(data => console.log('Score saved:', data))
        .catch(err => console.error('Error saving score:', err));
    }

    document.addEventListener("keydown",(e)=>{ keys[e.code]=true; });
    document.addEventListener("keyup",(e)=>{ keys[e.code]=false; });

    function moveCar(){
        if(keys["ArrowLeft"] && car.x>0) car.x -= car.dx;
        if(keys["ArrowRight"] && car.x+car.width<canvas.width) car.x += car.dx;
    }

    class Obstacle{
        constructor(){
            this.width = Math.random()*60 + 30;
            this.height = 20;
            this.x = Math.random()*(canvas.width - this.width);
            this.y = -20;
        }
        draw(){
            ctx.fillStyle="red";
            ctx.fillRect(this.x,this.y,this.width,this.height);
        }
        update(){
            this.y += speed;
            this.draw();
        }
    }

    function spawnObstacle(){
        if(!gameOver){
            obstacles.push(new Obstacle());
            setTimeout(spawnObstacle,1500);
        }
    }
    spawnObstacle();

    function update(){
        if(gameOver) return;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        moveCar();
        ctx.fillStyle="blue";
        ctx.fillRect(car.x,car.y,car.width,car.height);
        for(let i=obstacles.length-1;i>=0;i--){
            let ob=obstacles[i];
            ob.update();
            if(car.x < ob.x+ob.width && car.x+car.width > ob.x && car.y < ob.y+ob.height && car.y+car.height > ob.y){
                gameOver=true;
                // ✅ Save score when game is over
                saveScore(score);
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('carDodgeHighScore', highScore);
                    highScoreDisplay.textContent = highScore;
                    alert("New High Score! " + score);
                } else {
                    alert("Game Over! Score: " + score + "\nHigh Score: " + highScore);
                }
            }
            else if(ob.y > canvas.height){
                obstacles.splice(i,1);
                score++;
                scoreDisplay.textContent=score;
                if(score%5===0) speed += 0.5;
            }
        }
        requestAnimationFrame(update);
    }
    update();
    </script>
</body>
</html>
