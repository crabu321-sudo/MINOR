<!DOCTYPE html>
<html>
<head>
<title>My Gaming Platform</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    color:white;
    overflow-x:hidden;
    background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c1c1c);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Floating Particles */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

header{
    background:rgba(0,0,0,0.6);
    padding:20px;
    text-align:center;
    font-size:28px;
    font-weight:bold;
    backdrop-filter:blur(5px);
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(-20px);}
    to{opacity:1; transform:translateY(0);}
}

.games-container{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(220px,1fr));
    gap:25px;
    padding:40px;
}

.game-card{
    background:rgba(0,0,0,0.6);
    border-radius:12px;
    overflow:hidden;
    transition:0.4s;
    cursor:pointer;
    text-align:center;
    padding-bottom:15px;
    backdrop-filter:blur(5px);
    border:1px solid rgba(0,255,255,0.3);
}

.game-card:hover{
    transform:scale(1.07);
    background:rgba(0,0,0,0.85);
    box-shadow:0 0 20px #00ffff;
}

.game-card:active{
    transform:scale(0.97);
}

.game-image{
    height:160px;
    background:linear-gradient(45deg,#141e30,#243b55);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
}

.game-name{
    margin-top:12px;
    font-size:18px;
}

.high-score{
    font-size:14px;
    color:#00ffcc;
    margin-top:5px;
}

footer{
    text-align:center;
    padding:15px;
    background:rgba(0,0,0,0.6);
}
</style>

</head>
<body>

<canvas id="bg"></canvas>

<header>
🎮 My Gaming Platform
</header>

<div class="games-container">

<div class="game-card">
<div class="game-image">Picture 1</div>
<div class="game-name">Game 1</div>
<div class="high-score">High Score: 120</div>
</div>

<div class="game-card">
<div class="game-image">Picture 2</div>
<div class="game-name">Game 2</div>
<div class="high-score">High Score: 95</div>
</div>

<div class="game-card">
<div class="game-image">Picture 3</div>
<div class="game-name">Game 3</div>
<div class="high-score">High Score: 210</div>
</div>

<div class="game-card">
<div class="game-image">Picture 4</div>
<div class="game-name">Game 4</div>
<div class="high-score">High Score: 75</div>
</div>

</div>

<footer>
© 2026 My Gaming Platform
</footer>

<script>
// ===== Floating Particle Background =====
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for(let i=0;i<120;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2+1,
dx:Math.random()*1-0.5,
dy:Math.random()*1-0.5
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);

particles.forEach(p=>{
p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width) p.dx*=-1;
if(p.y<0||p.y>canvas.height) p.dy*=-1;

ctx.beginPath();
ctx.shadowColor="#00ffff";
ctx.shadowBlur=10;
ctx.fillStyle="rgba(0,255,255,0.7)";
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
});

requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize",()=>{
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
});
</script>

</body>
</html>
