<!DOCTYPE html>
<html>
<head>
    <title>Dino Runner</title>
    <style>
        body { text-align:center; font-family:sans-serif; background:#f0f0f0; }
        canvas { background:#87CEEB; display:block; margin:0 auto; border:2px solid #333; }
        h2 { color:#333; }
        button { margin-top:10px; padding:8px 15px; font-size:16px; cursor:pointer; }
    </style>
</head>
<body>
    <h2>Dino Runner</h2>
    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <p>Score: <span id="score">0</span></p>
    <button onclick="location.reload()">Back to Home</button>
    <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");

    let dino = { x:50, y:250, width:40, height:40, dy:0, gravity:0.6, jumpPower:-12 };
    let obstacles = [];
    let score = 0;
    let gameOver = false;
    let speed = 4;

    // ✅ Save score to Railway MySQL
    function saveScore(finalScore) {
        fetch('save_score.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `game=dino&score=${finalScore}`
        })
        .then(r => r.json())
        .then(data => console.log('Score saved:', data))
        .catch(err => console.error('Error saving score:', err));
    }

    // High score using localStorage
    function getHighScore() {
        return parseInt(localStorage.getItem('dinoHighScore')) || 0;
    }
    function saveHighScore(s) {
        localStorage.setItem('dinoHighScore', s);
    }

    document.addEventListener("keydown", (e) => {
        if(e.code === "Space" && dino.y === 250) dino.dy = dino.jumpPower;
    });

    class Obstacle {
        constructor() {
            this.width = 30;
            this.height = 40;
            this.x = canvas.width;
            this.y = 250;
            this.passed = false;
        }
        draw() {
            ctx.fillStyle = "red";
            ctx.fillRect(this.x, this.y, this.width, this.height);
        }
        update() {
            this.x -= speed;
            this.draw();
        }
    }

    setInterval(() => {
        if(!gameOver) obstacles.push(new Obstacle());
    }, Math.random() * 1500 + 1500);

    function update() {
        if(gameOver) return;
        ctx.clearRect(0,0,canvas.width, canvas.height);

        dino.dy += dino.gravity;
        dino.y += dino.dy;
        if(dino.y > 250) { dino.y = 250; dino.dy = 0; }

        ctx.fillStyle = "green";
        ctx.fillRect(dino.x, dino.y, dino.width, dino.height);

        for(let i = obstacles.length-1; i >= 0; i--) {
            let ob = obstacles[i];
            ob.update();

            if(dino.x < ob.x + ob.width &&
               dino.x + dino.width > ob.x &&
               dino.y < ob.y + ob.height &&
               dino.y + dino.height > ob.y) {
                gameOver = true;
                // ✅ Save score when game is over
                saveScore(score);
                const high = getHighScore();
                let msg = `Game Over! Score: ${score}`;
                if (score > high) {
                    saveHighScore(score);
                    msg += `\nNew High Score! 🎉`;
                } else {
                    msg += `\nHigh Score: ${high}`;
                }
                alert(msg);
                return;
            }

            if(!ob.passed && ob.x + ob.width < dino.x) {
                ob.passed = true;
                score++;
                scoreDisplay.textContent = score;
                if(score % 10 === 0) speed += 1;
            }

            if(ob.x + ob.width < 0) obstacles.splice(i,1);
        }
        requestAnimationFrame(update);
    }
    update();
    </script>
</body>
</html>
