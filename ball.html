<!DOCTYPE html>
<html>
<head>
    <title>Ball Catch Game</title>
    <style>
        body { text-align:center; font-family:sans-serif; background:#f0f0f0; }
        canvas { background:#87CEEB; display:block; margin:auto; border:2px solid #333; }
        h2 { color:#333; }
        button { margin-top:10px; padding:8px 15px; font-size:16px; cursor:pointer; }
    </style>
</head>
<body>
    <h2>Ball Catch Game</h2>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <p>Score: <span id="score">0</span></p>
    <button onclick="location.reload()">Restart Game</button>

    <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");

    let paddle = {
        x: 250, y: 370, width: 100, height: 15, dx: 12
    };
    let balls = [];
    let score = 0;
    let speed = 2;
    let gameOver = false;
    let keys = {};

    document.addEventListener("keydown", (e) => { keys[e.code] = true; });
    document.addEventListener("keyup", (e) => { keys[e.code] = false; });

    function movePaddle() {
        if(keys["ArrowLeft"]) paddle.x -= paddle.dx;
        if(keys["ArrowRight"]) paddle.x += paddle.dx;
        if(paddle.x < 0) paddle.x = 0;
        if(paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
    }

    class Ball {
        constructor() {
            this.radius = 15;
            this.x = Math.random() * (canvas.width - this.radius*2) + this.radius;
            this.y = -20;
        }
        draw() {
            ctx.fillStyle = "red";
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
            ctx.fill();
            ctx.closePath();
        }
        update() {
            this.y += speed;
            this.draw();
        }
    }

    function spawnBall() {
        if(!gameOver) {
            balls.push(new Ball());
            setTimeout(spawnBall, 1500);
        }
    }
    spawnBall();

    // ✅ Save score to Railway MySQL
    function saveScore(finalScore) {
        fetch('save_score.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `game=ball&score=${finalScore}`
        })
        .then(r => r.json())
        .then(data => console.log('Score saved:', data))
        .catch(err => console.error('Error saving score:', err));
    }

    function update() {
        if(gameOver) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        movePaddle();

        ctx.fillStyle = "green";
        ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);

        for(let i = balls.length - 1; i >= 0; i--){
            let b = balls[i];
            b.update();

            if(b.y + b.radius >= paddle.y && b.x >= paddle.x && b.x <= paddle.x + paddle.width){
                balls.splice(i, 1);
                score++;
                scoreDisplay.textContent = score;
                if(score % 5 === 0) speed += 0.5;
            }
            else if(b.y - b.radius > canvas.height){
                gameOver = true;
                // ✅ Save score when game is over
                saveScore(score);
                alert("Game Over! Score: " + score);
            }
        }
        requestAnimationFrame(update);
    }
    update();
    </script>
</body>
</html>
